[package]
name = "daily-snapshot-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "daily-snapshot-rust"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
tokei = "14.0"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = "0.4"
walkdir = "2.5"
