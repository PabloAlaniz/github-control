# Publishes a release when main carries a version that has no tag yet.
#
# A push to main whose package.json carries a version with no tag yet creates
# the tag v<version> and a GitHub release with generated notes, then publishes
# the Docker image for it. To release: bump the version in a pull request and
# merge it. Nothing happens while the version's tag already exists.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not a plain x.y.z: nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "v$VERSION is already tagged: nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  # A tag created by a workflow does not start other workflows, so the image is published from here.
  image:
    name: Docker image
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
