# Keeps a release pull request up to date and publishes a release when it is merged.
#
# On every push to main, release-please reads the commits since the last
# release (Conventional Commits: feat, fix, ...) and opens or updates a pull
# request with the next version and the changelog. Merging that pull request
# creates the tag vX.Y.Z and the GitHub release, and the Docker image for it
# is published from here.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag created by a workflow does not start other workflows, so the image is published from here.
  image:
    name: Docker image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
